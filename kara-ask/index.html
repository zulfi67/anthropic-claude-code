<title>Kara Aşk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@600;800&display=swap">
<style>
/* Layout: one vertical 9:16 "phone screen" stage, centred on black, everything layered over the WebGL canvas. */
:root {
  --ink: #050304;          /* letterbox black */
  --blood: #c4121f;        /* Kara Aşk red */
  --gold: #e8c27a;         /* title gold */
  --paper: #fbf6ee;        /* subtitle white */
  --smoke: rgba(10, 6, 8, .62);
  --display: "Playfair Display", "DejaVu Serif", Georgia, serif;
  --ui: "Montserrat", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); margin: 0; overflow: hidden;
  font-family: var(--ui);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
#wrap { height: 100%; display: grid; place-items: center; }
#stage {
  position: relative; height: 100%; max-height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  overflow: hidden; background: #000; container-type: inline-size;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grade { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.72) 100%),
    linear-gradient(180deg, rgba(20,0,10,.35), transparent 22%, transparent 75%, rgba(0,0,0,.55));
  mix-blend-mode: multiply; }
#grain { position: absolute; inset: -50%; pointer-events: none; opacity: .09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#redwash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, transparent 30%, rgba(160,0,10,.55)); opacity: 0; pointer-events: none; mix-blend-mode: screen; }

/* Title card */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; pointer-events: none; opacity: 0; gap: 2.2cqw; padding-bottom: 18cqw; }
#title .kara { font-family: var(--display); font-weight: 900; font-size: 19cqw; line-height: .9; letter-spacing: .02em;
  color: var(--paper); text-shadow: 0 0 4cqw rgba(196,18,31,.9), 0 .6cqw 0 #3a0006; }
#title .kara em { font-style: italic; color: var(--blood); text-shadow: 0 0 5cqw rgba(255,40,60,.75); }
#title .ep { font-family: var(--ui); font-weight: 800; font-size: 3.6cqw; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); }
#title .ep-fr { font-family: var(--display); font-style: italic; font-size: 4.6cqw; color: rgba(251,246,238,.85); }
#title .rule { width: 26cqw; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

/* Subtitles: French on top (big), Turkish original beneath (small) */
#sub { position: absolute; left: 6cqw; right: 6cqw; bottom: 21cqw; display: flex; flex-direction: column; align-items: center;
  gap: 1.6cqw; text-align: center; pointer-events: none; opacity: 0; }
#sub .who { font-weight: 800; font-size: 3.2cqw; letter-spacing: .28em; text-transform: uppercase; color: var(--ink);
  background: var(--gold); padding: .6cqw 2.2cqw; border-radius: .6cqw; }
#sub .fr { font-weight: 800; font-size: 6.4cqw; line-height: 1.12; color: var(--paper); text-wrap: balance;
  -webkit-text-stroke: .35cqw #000; paint-order: stroke fill; text-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.9); }
#sub .tr { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 3.9cqw; color: #ffd9c9; text-wrap: balance;
  text-shadow: 0 0 1cqw #000, 0 0 2cqw #000; }

/* Phone message overlay */
#msg { position: absolute; left: 9cqw; right: 9cqw; top: 30cqw; pointer-events: none; opacity: 0; transform: translateY(4cqw) scale(.96);
  display: flex; flex-direction: column; gap: 2cqw; }
#msg .head { display: flex; align-items: center; gap: 2.6cqw; font-weight: 800; font-size: 4cqw; color: var(--paper); text-shadow: 0 0 2cqw #000; }
#msg .avatar { width: 9cqw; height: 9cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7a5634, #2a1508); border: .5cqw solid var(--paper); flex: none; }
#msg .head small { display: block; font-weight: 600; font-size: 3cqw; opacity: .7; }
#msg .bubble { align-self: flex-start; max-width: 84%; background: rgba(38, 38, 44, .92); color: #fff; font-weight: 600; font-size: 5cqw;
  line-height: 1.25; padding: 3cqw 4cqw; border-radius: 5cqw 5cqw 5cqw 1.2cqw; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.6); }
#msg .bubble .heart { color: #ff2d55; }
#msg .fr { font-family: var(--display); font-style: italic; font-size: 4cqw; color: #ffd9c9; text-shadow: 0 0 1.5cqw #000; }

/* End card */
#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw;
  text-align: center; opacity: 0; pointer-events: none; padding-bottom: 10cqw; }
#end .devam { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 12cqw; line-height: 1; color: var(--paper);
  text-shadow: 0 0 5cqw rgba(196,18,31,.95); }
#end .suivre { font-weight: 800; font-size: 4.6cqw; letter-spacing: .4em; color: var(--blood); text-transform: uppercase; }
#end .next { margin-top: 6cqw; font-weight: 600; font-size: 3.4cqw; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
#end .q { font-family: var(--display); font-size: 4.2cqw; font-style: italic; color: rgba(251,246,238,.8); max-width: 70cqw; }

/* Player UI */
#ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
#play { pointer-events: auto; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; background: none; border: 0; color: var(--paper); cursor: pointer;
  font-family: var(--ui); }
#play .disc { width: 22cqw; height: 22cqw; border-radius: 50%; display: grid; place-items: center;
  background: rgba(196,18,31,.88); box-shadow: 0 0 0 1.2cqw rgba(196,18,31,.25), 0 0 9cqw rgba(196,18,31,.7); transition: transform .2s; }
#play:hover .disc, #play:focus-visible .disc { transform: scale(1.06); }
#play:focus-visible { outline: none; }
#play:focus-visible .disc { box-shadow: 0 0 0 1.2cqw var(--gold); }
#play .disc::after { content: ""; margin-left: 2cqw; border-style: solid; border-width: 5.5cqw 0 5.5cqw 9cqw; border-color: transparent transparent transparent var(--paper); }
#play .lbl { font-weight: 800; font-size: 4cqw; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 0 2cqw #000; }
#play .lbl small { display: block; font-weight: 600; font-size: 3cqw; letter-spacing: .12em; opacity: .8; margin-top: 1cqw; text-transform: none; font-style: italic; font-family: var(--display); }
#bar { pointer-events: auto; display: flex; align-items: center; gap: 2.4cqw; padding: 3cqw 4cqw calc(3cqw + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); opacity: .0; transition: opacity .3s; }
#stage:hover #bar, #bar:focus-within, #stage.paused #bar { opacity: 1; }
#bar button { background: rgba(255,255,255,.12); color: var(--paper); border: 1px solid rgba(255,255,255,.25); border-radius: 99px;
  font: 600 3.2cqw/1 var(--ui); padding: 1.8cqw 3.4cqw; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#prog { flex: 1; height: 1cqw; min-height: 3px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; }
#prog i { display: block; height: 100%; width: 0; background: var(--blood); }
#tag { position: absolute; top: calc(3.5cqw + env(safe-area-inset-top, 0px)); left: 4cqw; font: 800 2.8cqw/1 var(--ui); letter-spacing: .3em;
  color: rgba(251,246,238,.75); text-transform: uppercase; pointer-events: none; text-shadow: 0 0 1cqw #000; }
#tag b { color: var(--blood); }
.capture #ui, .capture #tag { display: none; }
@media (prefers-reduced-motion: reduce) { #grain { display: none; } }
</style>

<div id="wrap">
  <div id="stage" class="paused">
    <canvas id="c"></canvas>
    <div class="grade"></div>
    <div id="redwash"></div>
    <div id="grain"></div>
    <div id="flash"></div>

    <div id="title">
      <div class="ep">Bölüm 1</div>
      <div class="kara">KARA<br><em>AŞK</em></div>
      <div class="rule"></div>
      <div class="ep">İhanet</div>
      <div class="ep-fr">Épisode 1 : La Trahison</div>
    </div>

    <div id="msg">
      <div class="head"><span class="avatar"></span><span>Mustafa <small>şimdi · maintenant</small></span></div>
      <div class="bubble">Abim bunu asla öğrenmemeli… <span class="heart">♥</span></div>
      <div class="fr">« Mon frère ne doit jamais l'apprendre… »</div>

    <div id="sub"><span class="who"></span><span class="fr"></span><span class="tr"></span></div>

      <button id="play" type="button" aria-label="Play episode 1">

      </button>
      <div id="bar">

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(() => {
const CAPTURE = /[?&#]capture/.test(location.search + location.hash);
if (CAPTURE) document.documentElement.classList.add('capture');
const DUR = 40;
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pulse = (a, b, c, d, x) => sstep(a, b, x) * (1 - sstep(c, d, x));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
// deterministic noise
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };

/* ---------------- DIALOGUE ---------------- */
const LINES = [
  { who: 'Mehmet', s: 14.75, e: 18.3, tr: 'AYŞE! SEN BENİ NASIL ALDATIRSIN?!', fr: 'AYŞE ! COMMENT AS-TU PU ME TROMPER ?!', pitch: .7, rate: .92 },
  { who: 'Ayşe', s: 19.1, e: 23.2, tr: 'MEHMET, SANA ANLATMAM GEREKEN BİR ŞEY VAR!', fr: "MEHMET, IL Y A QUELQUE CHOSE QUE JE DOIS TE DIRE !", pitch: 1.35, rate: .95 },
  { who: 'Mustafa', s: 24.7, e: 28.2, tr: 'ABİ... SANA BİR ŞEY SÖYLEMEM LAZIM.', fr: 'GRAND FRÈRE… JE DOIS TE DIRE QUELQUE CHOSE.', pitch: 1.0, rate: .8 },
];
const VOW = { A: 1, E: .78, I: .45, 'İ': .5, O: .92, U: .6, 'Ü': .55, 'Ö': .7 };
LINES.forEach(L => {
  L.vis = [...L.tr].map(ch => VOW[ch] ?? (/[A-ZÇĞŞ]/.test(ch) ? .12 : 0));
});
function mouthFor(who, t) {
  for (const L of LINES) {
    if (L.who !== who || t < L.s - .05 || t > L.e + .1) continue;
    const p = clamp((t - L.s) / (L.e - L.s), 0, .9999);
    const f = p * L.vis.length, i = Math.floor(f), fr = f - i;
    const a = L.vis[i] || 0, b = L.vis[i + 1] || 0;
    return clamp(lerp(a, b, fr * fr * (3 - 2 * fr)) * (0.85 + .15 * noise1(t * 23)), 0, 1);
  }
  return 0;
}

/* ---------------- RENDERER ---------------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050304);
scene.fog = new THREE.FogExp2(0x0b0507, 0.035);
const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.03, 80);

/* ---------------- PROCEDURAL TEXTURES ---------------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// chitin: horizontal tergite bands, speckle, sheen streaks
function chitinMaps(base, bands = 9) {
  const draw = (g, w, h, bump) => {
    if (!bands) bands = 0;
    const col = new THREE.Color(base);
    g.fillStyle = bump ? '#808080' : '#' + col.getHexString(); g.fillRect(0, 0, w, h);
    for (let i = 0; i < bands; i++) { if (!bands) break;
      const y = i * h / bands;
      const gr = g.createLinearGradient(0, y, 0, y + h / bands);
      if (bump) { gr.addColorStop(0, '#b0b0b0'); gr.addColorStop(.8, '#7a7a7a'); gr.addColorStop(1, '#202020'); }
      else { gr.addColorStop(0, 'rgba(255,200,140,.10)'); gr.addColorStop(.75, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); }
      g.fillStyle = gr; g.fillRect(0, y, w, h / bands);
    }
    for (let i = 0; i < 2600; i++) {
      const x = rnd() * w, y = rnd() * h, r = rnd() * 1.6 + .3;
      g.fillStyle = bump ? `rgba(${rnd() > .5 ? 255 : 0},${0},${0},0)` : `rgba(${rnd() > .5 ? '40,18,6' : '120,70,30'},${.15 + rnd() * .25})`;
      if (bump) g.fillStyle = rnd() > .5 ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.25)';
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    if (!bump) for (let i = 0; i < 40; i++) {
      g.strokeStyle = `rgba(255,190,120,${.03 + rnd() * .05})`; g.lineWidth = 1 + rnd() * 3;
      const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 20, h * .3, x - 20, h * .6, x + 10, h); g.stroke();
    }
  };
  const map = canvasTex(512, 512, (g, w, h) => draw(g, w, h, false));
  const bump = canvasTex(512, 512, (g, w, h) => draw(g, w, h, true)); bump.encoding = THREE.LinearEncoding;
  return { map, bump };
}
const hexTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#120806'; g.fillRect(0, 0, w, h);
  const r = 7;
  for (let y = 0; y < h + r; y += r * 1.5) for (let x = 0; x < w + r; x += r * 1.732) {
    const ox = (Math.round(y / (r * 1.5)) % 2) * r * .866;
    g.beginPath();
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; g.lineTo(x + ox + Math.cos(a) * r * .92, y + Math.sin(a) * r * .92); }
    g.closePath(); g.fillStyle = `rgb(${30 + rnd() * 25},${14 + rnd() * 10},${8})`; g.fill();
    g.strokeStyle = '#050202'; g.lineWidth = 1.2; g.stroke();
  }
});
const skyTex = canvasTex(2048, 1152, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * .62);
  sky.addColorStop(0, '#05081c'); sky.addColorStop(.55, '#141a42'); sky.addColorStop(.85, '#4a2a4c'); sky.addColorStop(1, '#a0503a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .7})`; g.fillRect(rnd() * w, rnd() * h * .45, 1.4, 1.4); }
  // moon
  const mx = w * .76, my = h * .17;
  const mg = g.createRadialGradient(mx, my, 10, mx, my, 220); mg.addColorStop(0, 'rgba(255,240,210,.6)'); mg.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = mg; g.fillRect(mx - 230, my - 230, 460, 460);
  g.fillStyle = '#fff4dc'; g.beginPath(); g.arc(mx, my, 46, 0, 7); g.fill();
  g.fillStyle = '#141a42'; g.beginPath(); g.arc(mx + 20, my - 8, 42, 0, 7); g.fill(); // crescent
  const horizon = h * .6;
  // far shore (Asian side) with lights
  g.fillStyle = '#0a0a1a';
  g.beginPath(); g.moveTo(0, horizon);
  for (let x = 0; x <= w; x += 20) g.lineTo(x, horizon - 30 - Math.sin(x * .004) * 25 - rnd() * 8);
  g.lineTo(w, horizon); g.fill();
  for (let i = 0; i < 900; i++) { const x = rnd() * w, y = horizon - rnd() * 50; g.fillStyle = rnd() > .3 ? `rgba(255,${180 + rnd() * 60},${90 + rnd() * 60},${.5 + rnd() * .5})` : 'rgba(180,210,255,.7)'; g.fillRect(x, y, 2, 2); }
  // mosque silhouettes with domes and minarets
  const mosque = (cx, base, s) => {
    g.fillStyle = '#06060f';
    g.fillRect(cx - 120 * s, base - 60 * s, 240 * s, 60 * s);
    g.beginPath(); g.arc(cx, base - 60 * s, 70 * s, Math.PI, 0); g.fill();
    for (const dx of [-95, 95]) { g.beginPath(); g.arc(cx + dx * s, base - 60 * s, 28 * s, Math.PI, 0); g.fill(); }
    g.fillRect(cx - 3 * s, base - 150 * s, 6 * s, 20 * s);
    for (const dx of [-160, -135, 135, 160]) {
      g.fillRect(cx + dx * s - 6 * s, base - 230 * s, 12 * s, 230 * s);
      g.beginPath(); g.moveTo(cx + dx * s - 7 * s, base - 230 * s); g.lineTo(cx + dx * s, base - 285 * s); g.lineTo(cx + dx * s + 7 * s, base - 230 * s); g.fill();
      g.fillStyle = 'rgba(255,210,140,.9)'; g.fillRect(cx + dx * s - 8 * s, base - 170 * s, 16 * s, 3 * s); g.fillStyle = '#06060f';
    }
    const glow = g.createRadialGradient(cx, base - 60 * s, 10, cx, base - 60 * s, 200 * s);
    glow.addColorStop(0, 'rgba(255,190,110,.18)'); glow.addColorStop(1, 'rgba(255,190,110,0)');
    g.fillStyle = glow; g.fillRect(cx - 220 * s, base - 260 * s, 440 * s, 260 * s);
  };
  mosque(w * .2, horizon - 20, .9); mosque(w * .52, horizon - 24, .55);
  // galata-like tower
  g.fillStyle = '#07070f'; g.fillRect(w * .9 - 16, horizon - 190, 32, 170);
  g.beginPath(); g.moveTo(w * .9 - 22, horizon - 190); g.lineTo(w * .9, horizon - 250); g.lineTo(w * .9 + 22, horizon - 190); g.fill();
  g.fillStyle = 'rgba(255,220,150,.95)'; g.fillRect(w * .9 - 18, horizon - 180, 36, 5);
  // Bosphorus water
  const water = g.createLinearGradient(0, horizon, 0, h);
  water.addColorStop(0, '#1a1430'); water.addColorStop(1, '#03040c');
  g.fillStyle = water; g.fillRect(0, horizon, w, h - horizon);
  for (let i = 0; i < 700; i++) {
    const x = rnd() * w, y = horizon + rnd() * (h - horizon), len = 6 + rnd() * 40;
    g.fillStyle = `rgba(255,${170 + rnd() * 70},${100 + rnd() * 60},${rnd() * .35})`; g.fillRect(x, y, len, 1.5);
  }
  // suspension bridge with coloured lights
  const by = horizon + 18;
  g.strokeStyle = '#0d0d1c'; g.lineWidth = 8;
  g.beginPath(); g.moveTo(-50, by); g.lineTo(w + 50, by - 40); g.stroke();
  const t1 = w * .3, t2 = w * .72;
  g.fillStyle = '#0d0d1c'; g.fillRect(t1 - 6, by - 230, 12, 240); g.fillRect(t2 - 6, by - 250, 12, 260);
  const deck = x => by - 40 * (x + 50) / (w + 100);
  const cable = (x0, y0, x1, y1, sag) => x => { const u = (x - x0) / (x1 - x0); return lerp(y0, y1, u) + sag * 4 * u * (1 - u); };
  const c1 = cable(t1, by - 230, t2, by - 250, 200);
  for (let x = t1; x < t2; x += 7) {
    const hue = (x / w * 360 + 200) % 360;
    g.fillStyle = `hsla(${hue},90%,65%,.95)`; g.fillRect(x, c1(x), 3, 3);

function makeRoach(o) {
  const shell = chitinMaps(o.shell);
  const chitin = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: shell.map, bumpMap: shell.bump, bumpScale: .015, roughness: .38, clearcoat: 1, clearcoatRoughness: .12, sheen: .15, sheenColor: new THREE.Color(0xff9a50) });
  const hs = chitinMaps(o.shell, 0);
  const headMat = chitin.clone(); headMat.map = hs.map; headMat.bumpMap = hs.bump;
  const chitinDark = chitin.clone(); chitinDark.color = new THREE.Color(0x5a3a28);
  const wingMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(o.shell).multiplyScalar(.8), map: shell.map, roughness: .2, clearcoat: 1, transparent: true, opacity: .93 });
  const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: hexTex, roughness: .15, clearcoat: 1, clearcoatRoughness: .02 });
  const R = new THREE.Group(); R.userData = {};
  R.scale.setScalar(o.scale);

  // abdomen/torso
  const torso = sph(1, chitin, 32); torso.scale.set(.3, .5, .25); torso.position.y = .55; body.add(torso);
  // elytra

  // CLOTHES
  const unit = y => Math.sqrt(Math.max(0, 1 - Math.pow((y - .55) / .5, 2)));
  const prof = (y0, y1, k, n = 14) => { const p = []; for (let i = 0; i <= n; i++) { const y = lerp(y0, y1, i / n); p.push([Math.max(.02, unit(y) * k), y]); } return p; };
  const wear = (mesh) => { mesh.scale.set(.3, 1, .25); mesh.position.y = 0; body.add(mesh); return mesh; };
  if (o.cloth === 'suit') {
    const suit = new THREE.MeshPhysicalMaterial({ color: 0x070709, roughness: .5, sheen: .5, sheenColor: new THREE.Color(0x1c1c26), sheenRoughness: .5 });

    wear(lathe(prof(.62, .99, 1.115), shirt, 16, -.3, .6));
    wear(lathe(prof(.5, .98, 1.12), satin, 12, .3, .32));

    wear(lathe(prof(.52, .96, 1.125), new THREE.MeshPhysicalMaterial({ color: 0x150406, roughness: .3, clearcoat: .7 }), 6, -.06, .12));
    const knot = sph(.028, satin, 12); knot.position.set(0, .965, .095); knot.scale.set(1, .8, .6); body.add(knot);
    const sq = box(.05, .025, .01, new THREE.MeshStandardMaterial({ color: 0xa00c18, roughness: .4 })); sq.position.set(.17, .82, .21); sq.rotation.y = .6; body.add(sq);
    for (const y of [.5, .38]) { const b = sph(.012, M.gold, 8); b.position.set(0, y, .262); body.add(b); }
    R.userData.sleeve = suit;
  } else if (o.cloth === 'dress') {

    const pend = new THREE.Mesh(new THREE.OctahedronGeometry(.022), new THREE.MeshPhysicalMaterial({ color: 0xff1030, roughness: 0, transmission: .4, emissive: 0x300008 })); pend.position.set(0, .95, .15); body.add(pend);
    const rose = sph(.04, new THREE.MeshStandardMaterial({ color: 0x6a0008, roughness: .6 }), 12); rose.position.set(.2, .86, .17); body.add(rose);

  canvas.style.opacity = 1 - sstep(35.5, 35.65, t) * .85 - sstep(39, 40, t) * .15;
  canvas.style.filter = t > 35.5 ? 'grayscale(1) contrast(1.3) brightness(.5)' : '';
}

/* ---------------- FRAME ---------------- */
const baseProps = jumpers.map(j => ({ j, y: j.position.y, rz: j.rotation.z }));
function renderAt(t) {
  t = clamp(t, 0, DUR - .001);
  const st = stateAt(t);
  pose(mehmet, st.meh, t); pose(ayse, st.ay, t); pose(mustafa, st.mu, t);
  // slam: everything on the table jumps
  const k = tableShakeAt(t);
  baseProps.forEach((b, i) => { b.j.position.y = b.y + Math.abs(Math.sin((t - 14.6) * 30 + i)) * k * .035; b.j.rotation.z = b.rz + Math.sin((t - 14.6) * 25 + i * 2) * k * .15; });
  table.position.y = -k * .01 * Math.sin((t - 14.6) * 60);
  // candles flicker (gust after slam)
  const gust = k * 2;
  candles.forEach((c, i) => {
    const f = .85 + noise1(t * 9 + i * 7) * .12 + noise1(t * 23 + i) * .05;
    c.f.scale.set(.035 * (1 + gust * .3), .075 * f * (1 - gust * .3), 1);
    c.f.position.x = c.base.x + noise1(t * 5 + i) * .004 + gust * .01 * Math.sin(t * 40);
    c.gl.material.opacity = .45 + f * .15;
  });
  candleLight.intensity = 2.3 + noise1(t * 11) * .35 - gust * .6;
  // phone
  const ph = pulse(6.9, 7.0, 10.6, 11.2, t);
  const buzz = (t > 6.9 && t < 8.6) ? (Math.sin(t * 90) * .5 + .5) * .002 : 0;
  phone.position.x = -.42 + buzz;
  screenMat.color.setRGB(.3 * ph, .4 * ph, .6 * ph);
  phoneGlow.material.opacity = ph * .35; phoneLight.intensity = ph * .6;
  // face light & red light for the finale
  const S = shotAt(t);
  if (S.rel) {
    const hp = headPos({ mehmet, ayse, mustafa }[S.rel]);
    faceLight.position.copy(camera.position).sub(hp).multiplyScalar(1.6).add(hp).add(V(0, .45, 0)); faceLight.target.position.copy(hp); faceLight.intensity = .9;
  } else faceLight.intensity = 0;
  const fin = sstep(30.4, 33, t);
  redLight.position.copy(headPos(mehmet)).add(V(-.6, .2, .3)); redLight.intensity = fin * 3.5;
  key.intensity = 1.5 - fin * .9;
  rimMeh.intensity = 2.4 + fin * 2;
  placeCamera(t, S);
  overlays(t);
  renderer.render(scene, camera);
  $('#prog i').style.width = (t / DUR * 100) + '%';
}

/* ---------------- SCORE (Web Audio, works offline too) ---------------- */
function buildScore(ctx, t0) {
  const master = ctx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 4;
  const out = ctx.createGain(); out.gain.value = .9; master.connect(out); out.connect(ctx.destination);
  const verb = ctx.createConvolver();
  const len = ctx.sampleRate * 3.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let s = 99 + ch; for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647 * 2 - 1) * Math.pow(1 - i / len, 2.6); } }
  verb.buffer = ir; const wet = ctx.createGain(); wet.gain.value = .42; verb.connect(wet); wet.connect(master);
  const bus = ctx.createGain(); bus.connect(master); bus.connect(verb);
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  { const d = noiseBuf.getChannelData(0); let s = 5; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 2147483647 * 2 - 1; } }
  const T = x => t0 + x;
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // string ensemble chord
  function strings(notes, s, e, vol, opt = {}) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0, T(s)); g.gain.linearRampToValueAtTime(vol, T(s + (opt.att ?? 1.2)));
    g.gain.setValueAtTime(vol, T(e - (opt.rel ?? 1))); g.gain.linearRampToValueAtTime(0, T(e));
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(opt.cut0 ?? 1400, T(s)); f.frequency.linearRampToValueAtTime(opt.cut1 ?? 1800, T(e)); f.Q.value = .7;
    f.connect(g);
    if (opt.trem) { const lfo = ctx.createOscillator(); lfo.frequency.value = opt.trem; const lg = ctx.createGain(); lg.gain.value = vol * .45; lfo.connect(lg); lg.connect(g.gain); lfo.start(T(s)); lfo.stop(T(e)); }
    g.connect(bus);
    for (const n of notes) for (const dt of [-7, 0, 6]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = dt;
      if (opt.rise) o.detune.linearRampToValueAtTime(dt + opt.rise, T(e));
      const og = ctx.createGain(); og.gain.value = .06; o.connect(og); og.connect(f); o.start(T(s)); o.stop(T(e) + .05);
    }
  }
  function timpani(s, vol = 1, base = 62) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(base * 1.6, T(s)); o.frequency.exponentialRampToValueAtTime(base * .7, T(s + .5));
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, T(s)); g.gain.exponentialRampToValueAtTime(.001, T(s + 2.2));
    o.connect(g); g.connect(bus); o.start(T(s)); o.stop(T(s + 2.3));
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 500;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(vol * .7, T(s)); ng.gain.exponentialRampToValueAtTime(.001, T(s + .35));
    n.connect(nf); nf.connect(ng); ng.connect(bus); n.start(T(s)); n.stop(T(s + .4));
  }
  function brass(notes, s, d, vol) {
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(300, T(s)); f.frequency.exponentialRampToValueAtTime(3200, T(s + .08)); f.frequency.exponentialRampToValueAtTime(700, T(s + d));
    const g = ctx.createGain(); g.gain.setValueAtTime(0, T(s)); g.gain.linearRampToValueAtTime(vol, T(s + .03)); g.gain.exponentialRampToValueAtTime(.001, T(s + d));
    f.connect(g); g.connect(bus);
    for (const n of notes) for (const dt of [-5, 5]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = dt; const og = ctx.createGain(); og.gain.value = .08; o.connect(og); og.connect(f); o.start(T(s)); o.stop(T(s + d + .05)); }
  }
  function ney(seq, s, vol = .16) { // Hicaz melody, breathy flute
    let tt = s;
    for (const [n, d] of seq) {
      if (n) {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz(n);
        const vib = ctx.createOscillator(); vib.frequency.value = 5.2; const vg = ctx.createGain(); vg.gain.value = 9; vib.connect(vg); vg.connect(o.detune);
        const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = hz(n) * 2; const g2 = ctx.createGain(); g2.gain.value = .18; o2.connect(g2);
        const g = ctx.createGain(); g.gain.setValueAtTime(0, T(tt)); g.gain.linearRampToValueAtTime(vol, T(tt + .09)); g.gain.setValueAtTime(vol * .9, T(tt + d * .8)); g.gain.linearRampToValueAtTime(0, T(tt + d + .05));
        o.connect(g); g2.connect(g);
        const br = ctx.createBufferSource(); br.buffer = noiseBuf; const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = hz(n) * 2; bf.Q.value = 6; const bg = ctx.createGain(); bg.gain.value = .25;
        br.connect(bf); bf.connect(bg); bg.connect(g);
        g.connect(bus); [o, vib, o2, br].forEach(x => { x.start(T(tt)); x.stop(T(tt + d + .1)); });
      }
      tt += d;
    }
  }
  function thump(s, vol = .9) { const o = ctx.createOscillator(); o.frequency.setValueAtTime(60, T(s)); o.frequency.exponentialRampToValueAtTime(35, T(s + .15)); const g = ctx.createGain(); g.gain.setValueAtTime(vol, T(s)); g.gain.exponentialRampToValueAtTime(.001, T(s + .25)); o.connect(g); g.connect(master); o.start(T(s)); o.stop(T(s + .3)); }
  function buzz(s, d) { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 160; const am = ctx.createOscillator(); am.frequency.value = 30; const ag = ctx.createGain(); ag.gain.value = .5; am.connect(ag);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, T(s)); g.gain.linearRampToValueAtTime(.08, T(s + .02)); g.gain.setValueAtTime(.08, T(s + d - .02)); g.gain.linearRampToValueAtTime(0, T(s + d)); ag.connect(g.gain);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; o.connect(f); f.connect(g); g.connect(master); [o, am].forEach(x => { x.start(T(s)); x.stop(T(s + d)); }); }
  function crash(s) { // wood slam + glass clink
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.setValueAtTime(1.4, T(s)); g.gain.exponentialRampToValueAtTime(.001, T(s + .4)); n.connect(f); f.connect(g); g.connect(bus); n.start(T(s)); n.stop(T(s + .5));
    for (const [fr, dl] of [[2637, .03], [3520, .06], [3136, .11], [4186, .15]]) { const o = ctx.createOscillator(); o.frequency.value = fr; const og = ctx.createGain(); og.gain.setValueAtTime(.12, T(s + dl)); og.gain.exponentialRampToValueAtTime(.001, T(s + dl + .9)); o.connect(og); og.connect(bus); o.start(T(s + dl)); o.stop(T(s + dl + 1)); }
  }
  // Hicaz on D: D Eb F# G A Bb C D
  const D4 = 62, Eb4 = 63, Fs4 = 66, G4 = 67, A4 = 69, Bb4 = 70, C5 = 72, D5 = 74;
  strings([38, 50, 53, 57], 0, 4.6, .55, { att: 1.5 });
  ney([[A4, .7], [Bb4, .35], [A4, .35], [G4, .35], [Fs4, .7], [Eb4, .35], [D4, 1.2]], .6, .14);
  strings([34, 46, 50, 53], 4.4, 9.2, .45);
  ney([[0, .5], [D4, .4], [Eb4, .4], [Fs4, .4], [G4, .8], [A4, .4], [Bb4, .4], [A4, 1.2]], 4.6, .1);
  buzz(6.95, .35); buzz(7.5, .35); buzz(8.05, .35);
  strings([43, 55, 58, 63], 9.0, 13.7, .5, { trem: 9, cut0: 900, cut1: 2400 });
  strings([26, 38], 9.0, 13.9, .5, { rise: 100 });
  timpani(14.62, 1.3, 55); crash(14.62); brass([50, 57, 62, 65], 14.62, 1.8, .9);
  strings([45, 57, 61, 64, 69], 14.7, 18.8, .62, { trem: 11, att: .3, cut0: 2600, cut1: 1800 });
  timpani(16.5, .5, 55); timpani(17.5, .6, 52);
  strings([38, 50, 53, 57, 62], 18.6, 23.8, .5, { att: .8 });
  ney([[D5, .6], [C5, .3], [Bb4, .3], [A4, .9], [Bb4, .3], [A4, .3], [G4, .3], [Fs4, .9], [Eb4, .45], [D4, 1.2]], 19.0, .16);
  strings([34, 46, 50, 53], 23.6, 26.2, .45, { att: .6 });
  strings([39, 51, 55, 58], 26.0, 28.7, .5, { trem: 7, rise: 60 });
  strings([26], 23.6, 28.7, .6, { rise: 200, cut0: 300, cut1: 600 });
  for (let i = 0; i < 4; i++) { thump(28.7 + i * .5); thump(28.7 + i * .5 + .17, .6); }
  for (const s of [30.5, 31.3, 32.1]) { timpani(s, 1.2, 50); brass([38, 50, 57, 62, 63], s, .75, .9); }
  strings([38, 50, 51, 57, 62, 63, 69], 32.1, 35.55, .75, { att: 2.5, rel: .05, trem: 13, rise: 120, cut0: 900, cut1: 4200 });
  timpani(35.6, 1.5, 40);
  ney([[A4, .9], [Bb4, .45], [A4, .45], [Fs4, .9], [Eb4, .45], [D4, 1.6]], 36.1, .12);
  strings([38, 50, 53], 36.0, 40, .3, { att: 1.2, rel: 1.5 });
  return out;
}

/* ---------------- VOICES (browser playback only) ---------------- */
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(L) {
  if (muted || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(L.tr.toLocaleLowerCase('tr-TR').replace(/\.\.\./g, '…'));
    u.lang = 'tr-TR';
    const tr = voices.filter(v => /^tr/i.test(v.lang));
    if (tr.length) u.voice = tr[L.who === 'Ayşe' ? Math.min(1, tr.length - 1) : 0];
    u.pitch = L.pitch; u.rate = L.rate; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) { /* voice is optional */ }
}

/* ---------------- PLAYBACK ---------------- */
const stage = $('#stage');
let playing = false, t0 = 0, actx = null, outNode = null, muted = false, spoken = new Set();
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); if (!playing) renderAt(posterT); });
const posterT = 15.6;
function start() {
  stage.classList.remove('paused');
  $('#play').hidden = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (actx) { try { actx.close(); } catch (e) {} }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    outNode = buildScore(actx, actx.currentTime + .15);
    outNode.gain.value = muted ? 0 : .9;
    t0 = performance.now() + 150;
  } catch (e) { actx = null; t0 = performance.now(); }
  spoken = new Set(); playing = true;
  requestAnimationFrame(loop);
}
function loop() {
  if (!playing) return;
  const t = (performance.now() - t0) / 1000;
  for (const L of LINES) if (t >= L.s - .1 && !spoken.has(L)) { spoken.add(L); speak(L); }
  renderAt(Math.max(0, t));
  if (t >= DUR) { playing = false; stage.classList.add('paused'); $('#play').hidden = false; $('#play .lbl').firstChild.textContent = 'Tekrar izle'; return; }
  requestAnimationFrame(loop);
}
$('#play').addEventListener('click', start);
$('#replay').addEventListener('click', start);
$('#mute').addEventListener('click', e => {
  muted = !muted; e.currentTarget.textContent = muted ? 'Ses: kapalı' : 'Ses: açık'; e.currentTarget.setAttribute('aria-pressed', String(muted));
  if (outNode) outNode.gain.value = muted ? 0 : .9;
  if (muted) try { speechSynthesis.cancel(); } catch (e) {}
});

/* ---------------- CAPTURE HOOKS (offline MP4 export) ---------------- */
window.KARA = {
  DUR, LINES, renderAt: t => { renderAt(t); return true; },
  renderAudio: async () => {
    const sr = 48000, ctx = new OfflineAudioContext(2, sr * DUR, sr);
    buildScore(ctx, 0);
    const buf = await ctx.startRendering();
    const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); v.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true); }
    let s = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
    return btoa(s);
  },
};
resize();
renderAt(CAPTURE ? 0 : posterT);
})();
</script>
