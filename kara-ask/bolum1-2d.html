<title>Kara Aşk · Bölüm 1 (2D)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@600;800&display=swap">
<style>
/* Layout: one vertical 9:16 "phone screen" stage, centred on black, everything layered over the WebGL canvas. */
:root {
  --ink: #050304;          /* letterbox black */
  --blood: #c4121f;        /* Kara Aşk red */
  --gold: #e8c27a;         /* title gold */
  --paper: #fbf6ee;        /* subtitle white */
  --smoke: rgba(10, 6, 8, .62);
  --display: "Playfair Display", "DejaVu Serif", Georgia, serif;
  --ui: "Montserrat", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); margin: 0; overflow: hidden;
  font-family: var(--ui);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
#wrap { height: 100%; display: grid; place-items: center; }
#stage {
  position: relative; height: 100%; max-height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  overflow: hidden; background: #000; container-type: inline-size;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grade { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.72) 100%),
    linear-gradient(180deg, rgba(20,0,10,.35), transparent 22%, transparent 75%, rgba(0,0,0,.55));
  mix-blend-mode: multiply; }
#grain { position: absolute; inset: -50%; pointer-events: none; opacity: .09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#redwash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, transparent 30%, rgba(160,0,10,.55)); opacity: 0; pointer-events: none; mix-blend-mode: screen; }

/* Title card */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; pointer-events: none; opacity: 0; gap: 2.2cqw; padding-bottom: 18cqw; }
#title .kara { font-family: var(--display); font-weight: 900; font-size: 19cqw; line-height: .9; letter-spacing: .02em;
  color: var(--paper); text-shadow: 0 0 4cqw rgba(196,18,31,.9), 0 .6cqw 0 #3a0006; }
#title .kara em { font-style: italic; color: var(--blood); text-shadow: 0 0 5cqw rgba(255,40,60,.75); }
#title .ep { font-family: var(--ui); font-weight: 800; font-size: 3.6cqw; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); }
#title .ep-fr { font-family: var(--display); font-style: italic; font-size: 4.6cqw; color: rgba(251,246,238,.85); }
#title .rule { width: 26cqw; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

/* Subtitles: French on top (big), Turkish original beneath (small) */
#sub { position: absolute; left: 6cqw; right: 6cqw; bottom: 21cqw; display: flex; flex-direction: column; align-items: center;
  gap: 1.6cqw; text-align: center; pointer-events: none; opacity: 0; }
#sub .who { font-weight: 800; font-size: 3.2cqw; letter-spacing: .28em; text-transform: uppercase; color: var(--ink);
  background: var(--gold); padding: .6cqw 2.2cqw; border-radius: .6cqw; }
#sub .fr { font-weight: 800; font-size: 6.4cqw; line-height: 1.12; color: var(--paper); text-wrap: balance;
  -webkit-text-stroke: .35cqw #000; paint-order: stroke fill; text-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.9); }
#sub .tr { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 3.9cqw; color: #ffd9c9; text-wrap: balance;
  text-shadow: 0 0 1cqw #000, 0 0 2cqw #000; }

/* Phone message overlay */
#msg { position: absolute; left: 9cqw; right: 9cqw; top: 30cqw; pointer-events: none; opacity: 0; transform: translateY(4cqw) scale(.96);
  display: flex; flex-direction: column; gap: 2cqw; }
#msg .head { display: flex; align-items: center; gap: 2.6cqw; font-weight: 800; font-size: 4cqw; color: var(--paper); text-shadow: 0 0 2cqw #000; }
#msg .avatar { width: 9cqw; height: 9cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7a5634, #2a1508); border: .5cqw solid var(--paper); flex: none; }
#msg .head small { display: block; font-weight: 600; font-size: 3cqw; opacity: .7; }
#msg .bubble { align-self: flex-start; max-width: 84%; background: rgba(38, 38, 44, .92); color: #fff; font-weight: 600; font-size: 5cqw;
  line-height: 1.25; padding: 3cqw 4cqw; border-radius: 5cqw 5cqw 5cqw 1.2cqw; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.6); }
#msg .bubble .heart { color: #ff2d55; }
#msg .fr { font-family: var(--display); font-style: italic; font-size: 4cqw; color: #ffd9c9; text-shadow: 0 0 1.5cqw #000; }

/* End card */
#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw;
  text-align: center; opacity: 0; pointer-events: none; padding-bottom: 10cqw; }
#end .devam { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 12cqw; line-height: 1; color: var(--paper);
  text-shadow: 0 0 5cqw rgba(196,18,31,.95); }
#end .suivre { font-weight: 800; font-size: 4.6cqw; letter-spacing: .4em; color: var(--blood); text-transform: uppercase; }
#end .next { margin-top: 6cqw; font-weight: 600; font-size: 3.4cqw; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
#end .q { font-family: var(--display); font-size: 4.2cqw; font-style: italic; color: rgba(251,246,238,.8); max-width: 70cqw; }

/* Player UI */
#ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
#play { pointer-events: auto; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; background: none; border: 0; color: var(--paper); cursor: pointer;
  font-family: var(--ui); }
#play .disc { width: 22cqw; height: 22cqw; border-radius: 50%; display: grid; place-items: center;
  background: rgba(196,18,31,.88); box-shadow: 0 0 0 1.2cqw rgba(196,18,31,.25), 0 0 9cqw rgba(196,18,31,.7); transition: transform .2s; }
#play:hover .disc, #play:focus-visible .disc { transform: scale(1.06); }
#play:focus-visible { outline: none; }
#play:focus-visible .disc { box-shadow: 0 0 0 1.2cqw var(--gold); }
#play .disc::after { content: ""; margin-left: 2cqw; border-style: solid; border-width: 5.5cqw 0 5.5cqw 9cqw; border-color: transparent transparent transparent var(--paper); }
#play .lbl { font-weight: 800; font-size: 4cqw; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 0 2cqw #000; }
#play .lbl small { display: block; font-weight: 600; font-size: 3cqw; letter-spacing: .12em; opacity: .8; margin-top: 1cqw; text-transform: none; font-style: italic; font-family: var(--display); }
#bar { pointer-events: auto; display: flex; align-items: center; gap: 2.4cqw; padding: 3cqw 4cqw calc(3cqw + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); opacity: .0; transition: opacity .3s; }
#stage:hover #bar, #bar:focus-within, #stage.paused #bar { opacity: 1; }
#bar button { background: rgba(255,255,255,.12); color: var(--paper); border: 1px solid rgba(255,255,255,.25); border-radius: 99px;
  font: 600 3.2cqw/1 var(--ui); padding: 1.8cqw 3.4cqw; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#prog { flex: 1; height: 1cqw; min-height: 3px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; }
#prog i { display: block; height: 100%; width: 0; background: var(--blood); }
#tag { position: absolute; top: calc(3.5cqw + env(safe-area-inset-top, 0px)); left: 4cqw; font: 800 2.8cqw/1 var(--ui); letter-spacing: .3em;
  color: rgba(251,246,238,.75); text-transform: uppercase; pointer-events: none; text-shadow: 0 0 1cqw #000; }
#tag b { color: var(--blood); }
.capture #ui, .capture #tag { display: none; }
@media (prefers-reduced-motion: reduce) { #grain { display: none; } }
</style>

<div id="wrap">
  <div id="stage" class="paused">
    <canvas id="c"></canvas>
    <div class="grade"></div>
    <div id="redwash"></div>
    <div id="grain"></div>
    <div id="flash"></div>

    <div id="title">
      <div class="ep">Bölüm 1</div>
      <div class="kara">KARA<br><em>AŞK</em></div>
      <div class="rule"></div>
      <div class="ep">İhanet</div>
      <div class="ep-fr">Épisode 1 : La Trahison</div>
    </div>

    <div id="msg">
      <div class="head"><span class="avatar"></span><span>Mustafa <small>şimdi · maintenant</small></span></div>
      <div class="bubble">Abim bunu asla öğrenmemeli… <span class="heart">♥</span></div>
      <div class="fr">« Mon frère ne doit jamais l'apprendre… »</div>
    </div>

    <div id="sub"><span class="who"></span><span class="fr"></span><span class="tr"></span></div>

    <div id="tag"><b>●</b> Kara Aşk · B1</div>
    <div id="ui">
      <button id="play" type="button" aria-label="Play episode 1">
        <span class="disc"></span>
        <span class="lbl">Bölümü izle<small>Regarder l'épisode · son activé</small></span>
      </button>
      <div id="bar">
        <button id="replay" type="button">↺ Baştan</button>
        <div id="prog"><i></i></div>
        <button id="mute" type="button" aria-pressed="false">Ses: açık</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const CAPTURE = /[?&#]capture/.test(location.search + location.hash);
if (CAPTURE) document.documentElement.classList.add('capture');
const DUR = 40;
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pulse = (a, b, c, d, x) => sstep(a, b, x) * (1 - sstep(c, d, x));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
// deterministic noise
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };

/* ---------------- DIALOGUE ---------------- */
const LINES = [
  { who: 'Mehmet', s: 14.75, e: 18.3, tr: 'AYŞE! SEN BENİ NASIL ALDATIRSIN?!', fr: 'AYŞE ! COMMENT AS-TU PU ME TROMPER ?!', pitch: .7, rate: .92 },
  { who: 'Ayşe', s: 19.1, e: 23.2, tr: 'MEHMET, SANA ANLATMAM GEREKEN BİR ŞEY VAR!', fr: "MEHMET, IL Y A QUELQUE CHOSE QUE JE DOIS TE DIRE !", pitch: 1.35, rate: .95 },
  { who: 'Mustafa', s: 24.7, e: 28.2, tr: 'ABİ... SANA BİR ŞEY SÖYLEMEM LAZIM.', fr: 'GRAND FRÈRE… JE DOIS TE DIRE QUELQUE CHOSE.', pitch: 1.0, rate: .8 },
];
const VOW = { A: 1, E: .78, I: .45, 'İ': .5, O: .92, U: .6, 'Ü': .55, 'Ö': .7 };
LINES.forEach(L => {
  const up_ = [...L.tr.toLocaleUpperCase('tr-TR')];
  L.vis = up_.map(ch => /[MBP]/.test(ch) ? 0 : VOW[ch] ?? (/[A-ZÇĞŞ]/.test(ch) ? .14 : 0));
  L.wid = up_.map(ch => /[OUÖÜ]/.test(ch) ? .72 : /[EIİ]/.test(ch) ? 1.2 : 1);
});
function mouthFor(who, t) {
  for (const L of LINES) {
    if (L.who !== who || t < L.s - .05 || t > L.e + .1) continue;
    const p = clamp((t - L.s) / (L.e - L.s), 0, .9999);
    const f = p * L.vis.length, i = Math.floor(f), fr = f - i;
    const a = L.vis[i] || 0, b = L.vis[i + 1] || 0;
    return clamp(lerp(a, b, fr * fr * (3 - 2 * fr)) * (0.85 + .15 * noise1(t * 23)), 0, 1);
  }
  return 0;
}

function mouthWide(who, t) {
  for (const L of LINES) {
    if (L.who !== who || t < L.s - .05 || t > L.e + .1) continue;
    const p = clamp((t - L.s) / (L.e - L.s), 0, .9999), f = p * L.wid.length, i = Math.floor(f);
    return lerp(L.wid[i] || 1, L.wid[i + 1] || 1, f - i);
  }
  return 1;
}

/* ---------------- 2D STAGE ---------------- */
const W = 1080, H = 1920;
const canvas = $('#c'); canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TAU = Math.PI * 2;
// piecewise smooth keyframes: [[t, v], ...]
function seq(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 0; i < k.length - 1; i++) if (t <= k[i + 1][0]) { const u = sstep(k[i][0], k[i + 1][0], t); return lerp(k[i][1], k[i + 1][1], u); }
  return k[k.length - 1][1];
}
const lp = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
function seqP(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 0; i < k.length - 1; i++) if (t <= k[i + 1][0]) { const u = sstep(k[i][0], k[i + 1][0], t); return lp(k[i][1], k[i + 1][1], u); }
  return k[k.length - 1][1];
}
const shadeCol = (hex, k) => { const c = parseInt(hex.slice(1), 16); let r = c >> 16, gg = (c >> 8) & 255, b = c & 255;
  const f = v => Math.round(clamp(k >= 0 ? v + (255 - v) * k : v * (1 + k), 0, 255)); return `rgb(${f(r)},${f(gg)},${f(b)})`; };
function lin(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function rad(x, y, r0, r1, stops, ctx = g) { const gr = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function ell(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); return p; }
// rim light along the right or left edge of a shape (inside it)
function rimLight(path, x0, x1, side, col, w = 18) {
  g.save(); g.clip(path); g.lineWidth = w;
  g.strokeStyle = side > 0 ? lin(x0, 0, x1, 0, [[0, 'rgba(0,0,0,0)'], [.6, 'rgba(0,0,0,0)'], [1, col]]) : lin(x0, 0, x1, 0, [[0, col], [.4, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0)']]);
  g.stroke(path); g.restore();
}

/* ---------------- PAINTED BACKGROUNDS ---------------- */
function paintSkyline(c, w, h) {
  const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, h * .62);
  sky.addColorStop(0, '#04071a'); sky.addColorStop(.55, '#131a44'); sky.addColorStop(.86, '#4a2a50'); sky.addColorStop(1, '#a8563c');
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 420; i++) { x.fillStyle = `rgba(255,255,255,${rnd() * .7})`; x.fillRect(rnd() * w, rnd() * h * .45, 1.6, 1.6); }
  const mx = w * .74, my = h * .16;
  x.fillStyle = rad(mx, my, 10, 260, [[0, 'rgba(255,240,210,.55)'], [1, 'rgba(255,240,210,0)']], x); x.fillRect(mx - 270, my - 270, 540, 540);
  x.fillStyle = '#fff3d8'; x.beginPath(); x.arc(mx, my, 52, 0, TAU); x.fill();
  x.fillStyle = '#131a44'; x.beginPath(); x.arc(mx + 22, my - 9, 47, 0, TAU); x.fill();
  const hz = h * .6;
  x.fillStyle = '#0a0a1a'; x.beginPath(); x.moveTo(0, hz); for (let X = 0; X <= w; X += 20) x.lineTo(X, hz - 34 - Math.sin(X * .004) * 26 - rnd() * 8); x.lineTo(w, hz); x.fill();
  for (let i = 0; i < 1100; i++) { x.fillStyle = rnd() > .3 ? `rgba(255,${180 + rnd() * 60},${90 + rnd() * 60},${.5 + rnd() * .5})` : 'rgba(180,210,255,.7)'; x.fillRect(rnd() * w, hz - rnd() * 56, 2.2, 2.2); }
  const mosque = (cx, base, s) => {
    x.fillStyle = '#06060f'; x.fillRect(cx - 120 * s, base - 60 * s, 240 * s, 60 * s);
    x.beginPath(); x.arc(cx, base - 60 * s, 72 * s, Math.PI, 0); x.fill();
    for (const dx of [-95, 95]) { x.beginPath(); x.arc(cx + dx * s, base - 60 * s, 28 * s, Math.PI, 0); x.fill(); }
    for (const dx of [-160, -135, 135, 160]) { x.fillRect(cx + dx * s - 6 * s, base - 230 * s, 12 * s, 230 * s);
      x.beginPath(); x.moveTo(cx + dx * s - 7 * s, base - 230 * s); x.lineTo(cx + dx * s, base - 290 * s); x.lineTo(cx + dx * s + 7 * s, base - 230 * s); x.fill();
      x.fillStyle = 'rgba(255,210,140,.9)'; x.fillRect(cx + dx * s - 8 * s, base - 170 * s, 16 * s, 3 * s); x.fillStyle = '#06060f'; }
    x.fillStyle = rad(cx, base - 60 * s, 10, 220 * s, [[0, 'rgba(255,190,110,.2)'], [1, 'rgba(255,190,110,0)']], x); x.fillRect(cx - 240 * s, base - 280 * s, 480 * s, 280 * s);
  };
  mosque(w * .2, hz - 20, .9); mosque(w * .55, hz - 24, .55);
  x.fillStyle = '#07070f'; x.fillRect(w * .9 - 16, hz - 190, 32, 170); x.beginPath(); x.moveTo(w * .9 - 22, hz - 190); x.lineTo(w * .9, hz - 250); x.lineTo(w * .9 + 22, hz - 190); x.fill();
  const water = x.createLinearGradient(0, hz, 0, h); water.addColorStop(0, '#1a1430'); water.addColorStop(1, '#03040c'); x.fillStyle = water; x.fillRect(0, hz, w, h - hz);
  for (let i = 0; i < 800; i++) { x.fillStyle = `rgba(255,${170 + rnd() * 70},${100 + rnd() * 60},${rnd() * .35})`; x.fillRect(rnd() * w, hz + rnd() * (h - hz), 6 + rnd() * 40, 1.6); }
  const by = hz + 18, t1 = w * .3, t2 = w * .72;
  x.strokeStyle = '#0d0d1c'; x.lineWidth = 8; x.beginPath(); x.moveTo(-50, by); x.lineTo(w + 50, by - 40); x.stroke();
  x.fillStyle = '#0d0d1c'; x.fillRect(t1 - 6, by - 230, 12, 240); x.fillRect(t2 - 6, by - 250, 12, 260);
  const deck = X => by - 40 * (X + 50) / (w + 100);
  for (let X = t1; X < t2; X += 7) { const u = (X - t1) / (t2 - t1), cy = lerp(by - 230, by - 250, u) + 200 * 4 * u * (1 - u), hue = (X / w * 360 + 200) % 360;
    x.fillStyle = `hsla(${hue},90%,65%,.95)`; x.fillRect(X, cy, 3, 3); x.fillStyle = `hsla(${hue},90%,60%,.22)`; x.fillRect(X, cy, 1, deck(X) - cy);
    x.fillStyle = `hsla(${hue},90%,60%,.16)`; x.fillRect(X, hz + 60 + rnd() * 120, 3, 18 + rnd() * 30); }
  for (let X = 0; X < w; X += 9) { x.fillStyle = 'rgba(255,230,170,.85)'; x.fillRect(X, deck(X) - 3, 3, 2); }
}
const sky = mk(1600, 900); paintSkyline(sky, 1600, 900);
// the room, painted once (world space 2400 x 1920)
const WW = 2400, WH = 1920, FLOOR = 1560;
const room = mk(WW, WH);
(function paintRoom() {
  const x = room.getContext('2d');
  const wall = x.createLinearGradient(0, 0, 0, FLOOR); wall.addColorStop(0, '#2c0c13'); wall.addColorStop(1, '#170508'); x.fillStyle = wall; x.fillRect(0, 0, WW, FLOOR);
  x.strokeStyle = 'rgba(214,160,90,.07)'; x.lineWidth = 3;
  for (let yy = 0; yy < FLOOR; yy += 160) for (let xx = (yy / 160 % 2) * 90; xx < WW; xx += 180) { x.beginPath(); x.ellipse(xx, yy, 40, 60, 0, 0, TAU); x.stroke(); x.beginPath(); x.moveTo(xx, yy - 70); x.bezierCurveTo(xx + 40, yy - 20, xx - 40, yy + 20, xx, yy + 70); x.stroke(); }
  // window with skyline

/* ---------------- DINNER STAGING ---------------- */
const TABLE_Y = 1450;                       // table top line (world)
const STAGE = { ayse: { x: 720, y: 0, z: .92 }, mehmet: { x: 1080, y: 0, z: .96 }, mustafa: { x: 1440, y: 0, z: .92 } };
const seatY = n => TABLE_Y + 440 * DESIGN[n].scale * STAGE[n].z;   // table cuts the body at the waist
const STAND_Y = 1680;
function headW(n) { return [STAGE[n].x, STAGE[n].y - 830 * DESIGN[n].scale * STAGE[n].z]; }
const toLocal = (n, wx, wy) => [(wx - STAGE[n].x) / (DESIGN[n].scale * STAGE[n].z), (wy - STAGE[n].y) / (DESIGN[n].scale * STAGE[n].z)];

const SLAM = 14.6;
const slamK = t => t >= SLAM ? Math.max(0, 1 - (t - SLAM) / .6) ** 2 : 0;

function poses(t) {
  const tf = Math.min(t, 35.55);              // frozen after the cliffhanger
  // positions: seated or standing
  const stM = sstep(13.6, 14.3, tf), stU = sstep(23.7, 24.5, tf);
  STAGE.mehmet.y = lerp(seatY('mehmet'), STAND_Y, stM);
  STAGE.mustafa.y = lerp(seatY('mustafa'), STAND_Y, stU);
  STAGE.ayse.y = seatY('ayse');
  const tableL = n => toLocal(n, 0, TABLE_Y - 8)[1];
  // MEHMET (faces the camera, turns his head to whoever he watches)
  const yell = pulse(14.6, 14.9, 18.1, 18.8, tf);
  const mF = seq(tf, [[0, -.15], [3.5, .2], [6.9, -.15], [7.2, -.35], [24.3, -.35], [24.9, .4]]);
  let mHL = [-80, tableL('mehmet')], mHR = [80, tableL('mehmet')];
  if (tf > 13.6) { mHL = [-170, -260]; mHR = [180, -260]; }
  const up = tf < SLAM ? sstep(13.9, 14.45, tf) : 0;
  if (tf > 13.85 && tf < 16.4) { const down = toLocal('mehmet', STAGE.mehmet.x + 150, TABLE_Y - 10);
    mHR = tf < SLAM ? lp([180, -260], [330, -1000], up) : lp(down, [200, -300], sstep(15.4, 16.4, tf)); mHL = [-180, -330]; }
  const meh = { f: mF, lean: yell * .07 - sstep(25, 26.5, tf) * .02,
    anger: clamp(sstep(9.5, 12, tf) * .8 + yell * .3 - sstep(24.5, 26, tf) * 1.2, 0, 1),
    shock: sstep(25.2, 26.2, tf) * .55 + sstep(30.4, 30.6, tf) * .5, sad: 0, smile: tf < 9 ? .15 : -.25 - yell * .3,
    mouth: mouthFor('Mehmet', tf) + (tf < 7 ? (Math.sin(tf * 9) > .5 ? .18 : 0) * pulse(4.5, 5, 6, 6.5, tf) : 0), wide: mouthWide('Mehmet', tf),
    open: tf > 30.4 ? 1.05 : 1 - blinkAt(tf, 1), agit: sstep(9.5, 11, tf) * .5 + yell * .5,
    lookX: tf < 7 ? (Math.sin(tf * .5) > 0 ? -.7 : .7) : tf < 9.2 ? -.5 : tf < 24.3 ? -.8 : .85, lookY: tf > 7 && tf < 9.2 ? .7 : 0,
    breath: yell + sstep(9.5, 12, tf) * .5, handL: mHL, handR: mHR, gripR: tf > SLAM - .05 && tf < 15.4 ? 'open' : up > .5 ? 'fist' : 'open', gripL: 'open',
    bendL: tf < 13.6 ? 0 : 1, bendR: tf < 13.6 ? 0 : -1, tilt: -yell * .05 };
  // AYŞE (faces right, toward Mehmet)
  const cry = sstep(15.2, 17, tf);
  const grab = pulse(9.0, 9.6, 10.6, 11.3, tf);
  let aHL = toLocal('ayse', STAGE.ayse.x + 60, TABLE_Y - 8), aHR = toLocal('ayse', STAGE.ayse.x + 190, TABLE_Y - 8);
  aHR = lp(aHR, toLocal('ayse', 960, TABLE_Y - 12), grab);

    open: 1 - blinkAt(tf, 5), lookX: tf < 7 ? .6 : tf < 9.8 ? .5 : tf < 13.6 ? .9 : tf < 24 ? .6 : .9, lookY: tf > 6.9 && tf < 9.8 ? .7 : 0,
    droop: cry * .6, agit: sstep(9.3, 10, tf) * .4, breath: cry, handL: aHL, handR: aHR, bendL: cry > .3 || plead > .1 ? 1 : 0, bendR: cry > .3 || plead > .1 ? 1 : 0, tilt: cry * Math.sin(tf * 11) * .012 - cry * .05 };

    mouth: mouthFor('Mustafa', tf) + (tf < 7 ? (Math.sin(tf * 8 + 1) > .6 ? .2 : 0) * pulse(5.5, 6, 7, 7.3, tf) : 0), wide: mouthWide('Mustafa', tf),
    open: 1 - blinkAt(tf, 3), lookX: tf < 9.5 ? -.6 : tf < 13.6 ? -.5 : -.8, lookY: tf > 9.5 && tf < 13.6 ? .6 : 0, squint: sstep(25, 26, tf) * .2,
    browUp: tf > 24 ? .5 : 0, agit: pulse(9.5, 10, 13, 14, tf) * .6, handL: uHL, handR: uHR, bendL: stU > .3 ? 1 : 0, bendR: stU > .3 ? -1 : 0, tilt: stU * -.05 };

/* ---------------- VOICES (browser playback only) ---------------- */
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(L) {
  if (muted || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(L.tr.toLocaleLowerCase('tr-TR').replace(/\.\.\./g, '…'));
    u.lang = 'tr-TR';
    const tr = voices.filter(v => /^tr/i.test(v.lang));
    if (tr.length) u.voice = tr[L.who === 'Ayşe' ? Math.min(1, tr.length - 1) : 0];
    u.pitch = L.pitch; u.rate = L.rate; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) { /* voice is optional */ }
}

/* ---------------- PLAYBACK ---------------- */
const stage = $('#stage');
let playing = false, t0 = 0, actx = null, outNode = null, muted = false, spoken = new Set();
function resize() {
  const r = stage.getBoundingClientRect();
}
window.addEventListener('resize', () => { resize(); if (!playing) renderAt(posterT); });
const posterT = 15.6;
function start() {
  stage.classList.remove('paused');
  $('#play').hidden = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (actx) { try { actx.close(); } catch (e) {} }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    outNode = buildScore(actx, actx.currentTime + .15);
    outNode.gain.value = muted ? 0 : .9;
    t0 = performance.now() + 150;
  } catch (e) { actx = null; t0 = performance.now(); }
  spoken = new Set(); playing = true;
  requestAnimationFrame(loop);
}
function loop() {
  if (!playing) return;
  const t = (performance.now() - t0) / 1000;
  for (const L of LINES) if (t >= L.s - .1 && !spoken.has(L)) { spoken.add(L); speak(L); }
  renderAt(Math.max(0, t));
  if (t >= DUR) { playing = false; stage.classList.add('paused'); $('#play').hidden = false; $('#play .lbl').firstChild.textContent = 'Tekrar izle'; return; }
  requestAnimationFrame(loop);
}
$('#play').addEventListener('click', start);
$('#replay').addEventListener('click', start);
$('#mute').addEventListener('click', e => {
  muted = !muted; e.currentTarget.textContent = muted ? 'Ses: kapalı' : 'Ses: açık'; e.currentTarget.setAttribute('aria-pressed', String(muted));
  if (outNode) outNode.gain.value = muted ? 0 : .9;
  if (muted) try { speechSynthesis.cancel(); } catch (e) {}
});

/* ---------------- CAPTURE HOOKS (offline MP4 export) ---------------- */
window.KARA = {
  DUR, LINES, renderAt: t => { renderAt(t); return true; },
  renderAudio: async () => {
    const sr = 48000, ctx = new OfflineAudioContext(2, sr * DUR, sr);
    buildScore(ctx, 0);
    const buf = await ctx.startRendering();
    const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); v.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true); }
    let s = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
    return btoa(s);
  },
};
resize();
renderAt(CAPTURE ? 0 : posterT);
})();
